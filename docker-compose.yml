version: '3.8'

# Définition des variables communes pour Airflow pour éviter la duplication
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.7.1
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    # Utilisation de la base PostgreSQL commune pour stocker les métadonnées Airflow
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/mediatrends
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/mediatrends
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Variables pour les scripts Python
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=mediatrends
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    # Définition du chemin racine du projet pour Airflow
    - PROJECT_ROOT=/opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./data_lake:/opt/airflow/data_lake
    - ./scrapers:/opt/airflow/scrapers
    - ./transformations:/opt/airflow/transformations
    - ./quality:/opt/airflow/quality
    - ./warehouse:/opt/airflow/warehouse
    - ./requirements.txt:/requirements.txt
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ----------------------------------------------------
  # BASE DE DONNÉES - PostgreSQL
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: media_postgres
    environment:
      - POSTGRES_DB=mediatrends
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    networks:
      - media_network

  # ----------------------------------------------------
  # STOCKAGE OBJET - MinIO (Pour le futur Data Lake s3)
  # ----------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: media_minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    ports:
      - "9000:9000" # Port API
      - "9001:9001" # Port Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - media_network

  # ----------------------------------------------------
  # MESSAGING - Zookeeper & Kafka
  # ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: media_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - media_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: media_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - media_network

  # ----------------------------------------------------
  # ORCHESTRATION - Apache Airflow
  # ----------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: media_airflow_init
    command: >
      bash -c "
      pip install -r /requirements.txt &&
      airflow db init &&
      airflow db upgrade &&
      airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - media_network

  airflow-webserver:
    <<: *airflow-common
    container_name: media_airflow_webserver
    command: bash -c "pip install -r /requirements.txt && airflow webserver"
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - media_network

  airflow-scheduler:
    <<: *airflow-common
    container_name: media_airflow_scheduler
    command: bash -c "pip install -r /requirements.txt && airflow scheduler"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - media_network

  # ----------------------------------------------------
  # VISUALISATION - Streamlit Dashboard
  # ----------------------------------------------------
  streamlit-dashboard:
    image: python:3.9-slim
    container_name: media_streamlit
    working_dir: /app
    volumes:
      - ./dashboards:/app/dashboards
      - ./data_lake:/app/data_lake
      - ./requirements.txt:/app/requirements.txt
    command: >
      bash -c "pip install -r requirements.txt && 
               streamlit run dashboards/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mediatrends
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - media_network

# Définition du réseau commun pour faire communiquer tous les conteneurs
networks:
  media_network:
    driver: bridge

# Définition des volumes pour la persistance des données
volumes:
  postgres_data:
  minio_data:
  kafka_data:
